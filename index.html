const LSTEPS=[
 {h:'관리콘솔 로그인',sub:'admin.google.com 에 접속하면 아래 로그인 화면이 나옵니다.',img:()=>LOGIN_IMG,alt:'Google 계정 로그인 화면 캡처: 이메일 또는 휴대전화 입력 칸',help:'[이메일 또는 휴대전화] 칸에 학교관리자 아이디(끝자리 01~03)를 넣고 [다음]을 누릅니다.'},
 {h:'비밀번호 입력',sub:'아이디를 넣고 [다음]을 누르면 비밀번호 입력 화면이 나옵니다.',img:()=>PW_IMG,alt:'Google 비밀번호 입력 화면 캡처',help:'화면 왼쪽에 계정 이름(학교관리자)과 아이디가 표시됩니다. 내 학교의 학교관리자 아이디가 맞는지 확인한 뒤 비밀번호를 넣고 [다음]을 누릅니다.'},
 {h:'2단계 인증 ① 방법 선택',sub:'비밀번호 다음에는 "계정의 전화번호를 사용합니다" 화면이 나옵니다.',img:()=>LIMG.method,alt:'계정의 전화번호를 사용합니다 화면 캡처: 로그인 방법 선택, 2단계 인증 전화번호',help:'[로그인 방법을 선택하세요]에서 <b>2단계 인증 전화번호</b>를 누르면 그 번호로 인증 코드가 전송됩니다.'},
 {h:'2단계 인증 ② 코드 입력',sub:'6자리 인증 코드가 SMS로 전송됩니다.',img:()=>LIMG.code,alt:'2단계 인증 화면 캡처: 6자리 인증 코드 입력 칸, 이 기기에서 다시 요청하지 않음 체크박스',help:'문자로 받은 6자리 코드를 [코드 입력] 칸에 넣고 [다음]을 누릅니다. 코드는 계정에 등록된 전화번호로만 오므로, 그 전화를 가진 담당자가 함께 있어야 합니다. 여러 사람이 쓰는 PC에서는 <b>이 기기에서 다시 요청하지 않음</b> 체크를 해제하는 것이 안전합니다.'},
 {h:'이 프로필이 관리됩니다',sub:'인증을 마치면 Chrome이 학교 계정용 프로필 안내를 보여 줍니다.',img:()=>LIMG.managed,alt:'이 프로필이 관리됩니다 화면 캡처: 조직(senedu.kr)에서 프로필 정보와 기기 정보를 볼 수 있음, 계속/취소 버튼',help:'조직(senedu.kr)이 이 프로필을 관리한다는 안내입니다. <b>[계속]</b>을 누릅니다.'},
 {h:'동기화 안내',sub:'마지막으로 방문 기록과 탭을 동기화할지 묻습니다.',img:()=>LIMG.sync,alt:'시간은 아끼고, 입력은 줄이고 화면 캡처: 방문 기록과 탭 동기화 여부, 나중에/예 버튼',help:'어느 쪽을 눌러도 다음으로 넘어갑니다. 여러 사람이 쓰는 PC라면 <b>[나중에]</b>를 권합니다. 이 화면을 지나면 관리콘솔이 열립니다.'}];
function loginHTML(){const st=S.lstep,bub=(n,cls,h,b)=>`<div class="lbub ${cls}"><b><span>${n}</span>${h}</b>${b}</div>`,L=LSTEPS[st],last=st===LSTEPS.length-1;
  const card=`<div class="lprog">${st+1} / ${LSTEPS.length}</div><h2>${L.h}</h2><p class="lsub">${L.sub}</p>

const A=appliedGet;
function restricted(){return inIv('sched')}
function inIv(key){const mm=t=>+t.slice(0,2)*60+ +t.slice(3),now=S.cb.day*1440+mm(S.cb.time);
  return A(key).some(([sd,st,ed,et])=>{let a=sd*1440+mm(st),b=ed*1440+mm(et);if(b<=a)b+=10080;return (now>=a&&now<b)||(now+10080>=a&&now+10080<b)})}
function hostOf(u){return String(u).trim().toLowerCase().replace(/^[a-z]+:\/\//,'').replace(/[\/?#].*$/,'').replace(/^www\./,'')}
function match(list,host){return list.some(p=>{p=hostOf(p);if(p==='*')return true;if(p.startsWith('*.'))p=p.slice(2);if(p.startsWith('.'))return host===p.slice(1);return host===p||host.endsWith('.'+p)})}

     <div class="managed">🖥️ ${DOMAIN}에서 관리하는 Chromebook</div></div>`}
  else{const guest=c.screen!=='session';const pg=c.page||{ok:1,html:c.screen==='guest'?'<div class="big">🕶️</div><b style="color:#3c4043">게스트로 탐색 중 (계정 없음)</b>학교 정책이 적용되지 않습니다.<br>주소를 입력해 차단이 뚫리는지 확인해 보세요.':c.screen==='personal'?'<div class="big">📧</div><b style="color:#3c4043">개인 Gmail 계정으로 크롬북에 로그인함</b>학교 계정이 아니라서 학교 사용자 정책이 따라오지 않습니다.<br>주소를 입력해 차단이 뚫리는지 확인해 보세요.':'<div class="big">🌐</div>주소를 입력하거나 아래 사이트를 눌러<br>정책이 어떻게 적용되는지 확인하세요.'};
    scr=`<div class="brow">${c.screen==='guest'?'<div class="guestbar">👤 게스트 세션 · 계정 없이 사용 중 · 학교 정책 미적용</div>':c.screen==='personal'?'<div class="guestbar" style="background:#b06000">📧 kid@gmail.com (개인 계정)으로 크롬북에 로그인함 · 학교 정책 미적용</div>':'<div class="guestbar" style="background:#0b57d0">🎓 student@'+DOMAIN+' (학교 계정) · 학교 정책 적용 중</div>'}<div class="btop"><form><input data-cbt="url" value="${esc(c.url)}" placeholder="주소 입력"><button>이동</button></form><button data-cb="logout" title="로그아웃">⏻</button></div>

   ${routeLegend()}
   <div class="sessinfo">${sess?(+A('sessionLen')>0?`⏱ 사용자 세션 최대 길이: 로그인 ${A('sessionLen')}분 후 자동 로그아웃 → 로그인 화면 (전원은 꺼지지 않음)`:'⏱ 세션 길이 제한 없음'):c.screen!=='login'?'게스트·개인 계정 세션에는 학교 사용자 정책이 적용되지 않습니다.':'로그인 화면은 <b>기기 설정</b> 탭의 정책이 결정합니다.<br>로그인 화면에 그대로 두면: '+(A('loginPower')==='allow'?'💤 잠시 뒤 스스로 절전·종료 (배터리 절약)':'🔋 계속 켜져 있음 (배터리 소모)')}${sess?'<br>📦 배포된 앱: '+(S.apps.filter(x=>x.inst!=='block').length?S.apps.filter(x=>x.inst!=='block').map(x=>esc(x.name)+(x.type==='play'&&S.arc!=='on'?' (Android 앱 허용 꺼짐 → 사용 불가)':'')).join(', '):'없음')+' · Play 스토어: '+(S.arc==='on'?'사용 가능':'사용 불가'):''}${S.applied?'':'<br>아직 정책을 한 번도 불러오지 않았습니다 (기본값 상태).'}</div>`}
function routeLegend(){const g=A('guest')==='off',l=A('signinMode')!=='any'&&!(A('signinMode')==='list'&&mailOk('kid@gmail.com',A('signinList'))),b=A('signin')!=='any';

    return{el:'#nav-settings',n:'1',pos:'r',t:'<kbd>기기</kbd> › <kbd>Chrome</kbd> › <kbd>설정</kbd>으로 이동합니다.'}}

  if(m.ou==='staff'&&S.ou!=='staff')return{el:'#ou-staff',n:'2',pos:'r',t:'이 설정은 교사 계정에 적용합니다. 교사 계정이 들어 있는 <kbd>교사</kbd> 조직 단위를 클릭하세요.'};
  if(s.tab==='user'&&!m.ou&&!['student',USER_OU].includes(S.ou))return{el:'#ou-student',n:'2',pos:'r',t:'사용자 설정은 계정을 따라갑니다. 최상위가 아닌 <kbd>학생</kbd> 조직 단위를 먼저 클릭하세요.'};

  if(S.detail!==m.s){if(S.detail)return{el:'#back',n:'3',pos:'t',t:'다른 설정이 열려 있습니다. <kbd>닫기</kbd>를 눌러 목록으로 돌아가세요.'};

let gq,gscroll=true;function queueGuide(e){gscroll=!(e&&e.type==="scroll");clearTimeout(gq);gq=setTimeout(showGuide,60)}
function showGuide(){const b=$('#bubble');document.querySelectorAll('.pulse').forEach(e=>e.classList.remove('pulse'));
  if(!S.bubble){b.classList.remove('show');return}const g=guideStep();const el=g&&document.querySelector(g.el);
  if(!el||!el.offsetParent){b.classList.remove('show');return}
  if(gscroll)el.scrollIntoView({block:"nearest"});el.classList.add('pulse');
  $('#bStep').textContent=`미션 ${S.mission+1} · ${MISSIONS[S.mission].t}`;$('#bText').innerHTML=g.t;
  b.className='bubble show';const r=el.getBoundingClientRect(),W=268,H=b.offsetHeight,vw=innerWidth,vh=innerHeight;let pos=g.pos,x,y;
  if(pos==='r'&&r.right+W+20>vw)pos='b';if(pos==='l'&&r.left-W-20<0)pos='b';if(pos==='b'&&r.bottom+H+20>vh)pos='t';
  if(pos==='r'){x=r.right+14;y=r.top+Math.min(r.height/2,40)-22}else if(pos==='l'){x=r.left-W-14;y=r.top+Math.min(r.height/2,40)-22}
  else if(pos==='b'){x=r.left+Math.min(r.width/2,120)-36;y=r.bottom+14}else{x=r.left+Math.min(r.width/2,120)-36;y=r.top-H-14}
  const x2=Math.max(8,Math.min(x,vw-W-8)),y2=Math.max(8,Math.min(y,vh-H-8));
  b.style.left=x2+'px';b.style.top=y2+'px';b.style.setProperty('--ax',Math.max(14,Math.min(30+(x-x2),W-28))+'px');b.style.setProperty('--ay',Math.max(12,Math.min(22+(y-y2),H-26))+'px');
  b.classList.add({r:'pl',l:'pr',b:'pt',t:'pb'}[pos])}
addEventListener('resize',queueGuide);document.addEventListener('scroll',queueGuide,true);

document.getElementById('haspanel').addEventListener('click',e=>{
  const sel=e.target.closest('#hProdSel');if(sel){const o=document.getElementById('hProdOpts');o.style.display=o.style.display==='none'?'block':'none';return;}
  const prod=e.target.closest('[data-prod]');if(prod){if(prod.dataset.prod==='chrome'){hasState='loading';renderHelp();}else{const o=document.getElementById('hProdOpts');if(o)o.style.display='none';}return;}
  const ask=e.target.closest('[data-ask]');if(ask){hasState='ans:'+ask.dataset.ask;renderHelp();return;}
});

render();
